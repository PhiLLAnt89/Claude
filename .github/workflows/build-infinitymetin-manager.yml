name: InfinityMetin Claude Manager

on:
  push:
    paths:
      - "infinitymetin_claude_manager/**"
      - ".github/workflows/build-infinitymetin-manager.yml"
  workflow_dispatch:

jobs:
  test:
    name: Headless tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infinitymetin_claude_manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pygame pytest
      - run: python -m pytest -q tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

  windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: infinitymetin_claude_manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pygame pyinstaller pytest
      - name: Tests on Windows
        run: python -m pytest -q tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "InfinityMetin Claude Manager" infinitymetin_claude_manager.py
      - name: Smoke-test the exe (opens and closes with a dummy display)
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process -FilePath "dist\InfinityMetin Claude Manager.exe" -ArgumentList "--sim","--fresh","--scale","1" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Host "exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: InfinityMetin-Claude-Manager-windows
          path: infinitymetin_claude_manager/dist/InfinityMetin Claude Manager.exe
          if-no-files-found: error
